<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JEFF PRO</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7f6;
    color: #111827;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    background: #ffffff;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

/* =========================
   HEADER
========================= */

.header {
    position: relative;
    min-height: 75px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
}

.online {
    position: absolute;
    left: 50%;
    top: 5px;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
}

.online::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #16a34a;
    border-radius: 50%;
    margin-right: 7px;
}

/* =========================
   INTRO
========================= */

.intro {
    text-align: center;
    margin-bottom: 20px;
}

.intro h2 {
    font-size: 20px;
    margin-bottom: 8px;
}

.intro p {
    color: #555;
    line-height: 1.5;
}

/* =========================
   AUDIO
========================= */

.audio-box {
    text-align: center;
    margin: 20px 0 25px;
}

.audio-title {
    display: inline-block;
    background: #111827;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: bold;
    margin-bottom: 10px;
}

audio {
    width: 100%;
    max-width: 500px;
}

/* =========================
   QUESTION TITLE
========================= */

.question-title {
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    margin: 20px 0 15px;
}

/* =========================
   OPTIONS VERTES
========================= */

.option {
    width: 100%;
    border: 2px solid #22c55e;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
    background: #ffffff;
    color: #111827;
    font-size: 16px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 2px 7px rgba(34,197,94,0.10);
}

.option:hover {
    background: #f0fdf4;
    transform: translateY(-1px);
}

.option:active {
    background: #dcfce7;
    transform: scale(0.98);
}

/* =========================
   CHAT
========================= */

.chat {
    display: none;
    margin-top: 20px;
}

.chat.active {
    display: block;
}

.message {
    background: #f1f5f9;
    border-radius: 15px;
    padding: 17px;
    line-height: 1.65;
    white-space: pre-line;
    font-size: 15px;
}

.chat-input {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.chat-input input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 13px;
    font-size: 15px;
    outline: none;
}

.chat-input input:focus {
    border-color: #22c55e;
}

.send {
    border: none;
    background: #22c55e;
    color: white;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 20px;
    cursor: pointer;
}

/* =========================
   CAPTURE D'ÉCRAN
========================= */

.capture-box {
    margin-top: 15px;
    padding: 15px;
    border: 2px dashed #22c55e;
    border-radius: 14px;
    background: #f0fdf4;
}

.capture-box label {
    display: block;
    font-weight: 800;
    margin-bottom: 10px;
}

.capture-box input[type="file"] {
    width: 100%;
    padding: 10px;
    background: white;
    border-radius: 10px;
}

.next-button {
    width: 100%;
    border: none;
    background: #22c55e;
    color: white;
    padding: 14px;
    border-radius: 12px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

.next-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* =========================
   PLATEFORMES
========================= */

.platform-title {
    text-align: center;
    font-weight: 900;
    margin: 30px 0 15px;
}

.platforms {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.platform {
    text-decoration: none;
    color: white;
    text-align: center;
    padding: 16px 5px;
    border-radius: 14px;
    font-weight: 900;
}

.onexbet {
    background: #1877f2;
}

.melbet {
    background: #f97316;
}

.paripesa {
    background: #0057ff;
}

/* =========================
   BAS DE PAGE
========================= */

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

.whatsapp {
    flex: 1;
    background: #25d366;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 15px 8px;
    border-radius: 13px;
    font-weight: 900;
}

.promo {
    flex: 1;
    text-align: center;
}

.promo small {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.code {
    display: block;
    background: #facc15;
    color: #111;
    border-radius: 12px;
    padding: 10px 5px;
    font-size: 29px;
    font-weight: 1000;
    letter-spacing: 2px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px) {

    .container {
        padding: 17px;
    }

    .platforms {
        grid-template-columns: 1fr;
    }

    .bottom {
        flex-direction: column;
    }

    .whatsapp,
    .promo {
        width: 100%;
    }

    .online {
        font-size: 16px;
    }
}

</style>
</head>

<body>

}

/* ==================================================
   CHAT AUTOMATIQUE
================================================== */

function sendMessage() {

    const input =
        document.getElementById("userInput");

    const text =
        input.value.trim();

    if (!text) return;

    const lower =
        text.toLowerCase();


    /* SALUT */

    if (
        lower === "salut" ||
        lower === "bonjour" ||
        lower === "bonsoir" ||
        lower.includes("salut") ||
        lower.includes("bonjour") ||
        lower.includes("bonsoir") ||
        lower.includes("coucou")
    ) {

        showGreeting();

        input.value = "";

        return;
    }


    /* COMMENT ÇA VA */

    if (
        lower.includes("ça va") ||
        lower.includes("ca va") ||
        lower.includes("comment vas")
    ) {

        showMessage(
`🤖 JEFF PRO

Dis-moi simplement ce qui t'intéresse :

🎲 Jeu des Dés

⚽ FIFA

    if (

        lower.includes("fortune")
    ) {

        showApple();

        input.value = "";

        return;
    }


    /* DÉS */

    if (
        lower.includes("dés") ||
        lower.includes("des")
    ) {

        showDice();

        input.value = "";

        return;
    }


    /* CODE PROMO */

    if (
        lower.includes("code promo") ||

        lower.includes("code")
    ) {

        showMessage(
`🟡 CODE PROMO JEFF PRO

Le code promo est :

8F9Y

⚠️ Vérifie bien que le code 8F9Y est appliqué lors de ton inscription.`
        );

        input.value = "";

        return;
    }


    /* 1XBET */

    if (
        lower.includes("1xbet")
    ) {

        showMessage(
`🔵 1XBET

Voici le lien d'inscription :

https://reffpa.com/L?tag=d_4215855m_97c_&site=4215855&ad=97&r=registration

Code promo : 8F9Y`
        );

        input.value = "";

        return;
    }


    /* MELBET */

    if (
        lower.includes("melbet")
    ) {

        showMessage(
`🟠 MELBET

Voici le lien d'inscription :

https://refpa3665.com/L?tag=d_4139550m_45415c_&site=4139550&ad=45415&r=registration

Code promo : 8F9Y`
        );

    /* PARIPESA */

`🔵 PARIPESA

Voici le lien d'inscription :

https://paripesa.bet/christtpronoso

Code promo : 8F9Y`
        );

    /* SCORE EXACT */

        input.value = "";

        return;
    }


    /* FIFA */

    ) {

        showFifa();

        input.value = "";

        return;
    }


    /* POKER */

        lower.includes("poker")
    ) {

        showPoker();

        input.value = "";

        return;
    }


    /* INSCRIPTION */

    if (
        lower.includes("inscription") ||
        lower.includes("inscrire") ||

        lower.includes("comment je m'inscris")

`🤖 JEFF PRO
