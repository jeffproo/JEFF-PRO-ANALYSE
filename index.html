<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">

  <title>JEFF PRO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f3f6fa;
      color: #172033;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #111827;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 5px 14px rgba(0,0,0,.12);
    }

    .online {
      text-align: center;
      margin: 16px 0 18px;
      font-size: 17px;
      font-weight: 800;
      color: #16a34a;
    }

    .online::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 7px;
      box-shadow: 0 0 0 4px rgba(34,197,94,.12);
    }

    /* INTRO */
    .intro {
      background: white;
      border-radius: 22px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(20,35,60,.07);
      border: 1px solid #e8edf4;
    }

    .intro h1 {
      font-size: 21px;
      margin-bottom: 8px;
      color: #111827;
    }

    .intro p {
      font-size: 15px;
      line-height: 1.55;
      color: #667085;
    }

    /* AUDIO */
    .audio-box {
      margin-top: 17px;
      padding: 15px;
      border-radius: 17px;
      background: #f7f9fc;
      border: 1px solid #e6ebf2;
    }

    .audio-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 9px;
      color: #172033;
    }

    audio {
      width: 100%;
      height: 42px;
    }

    .question-title {
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      margin: 22px 0 13px;
      color: #344054;
    }

    /* QUESTION BUTTONS */
    .questions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .question-btn {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px 16px;
      background: white;
      color: #172033;
      font-size: 15px;
      font-weight: 750;
      text-align: left;
      cursor: pointer;
      border: 1px solid #e4e9f0;
      box-shadow: 0 4px 14px rgba(20,35,60,.045);
      transition: .18s ease;
    }

    .question-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(20,35,60,.09);
    }

    .question-btn:active {
      transform: scale(.985);
    }

    /* CHAT */
    .chat {
      margin-top: 18px;
      display: none;
    }

    .chat.active {
      display: block;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .message {
      max-width: 94%;
      padding: 15px;
      border-radius: 17px;
      font-size: 14.5px;
      line-height: 1.58;
      white-space: pre-line;
    }

    .bot-message {
      align-self: flex-start;
      background: white;
      border: 1px solid #e5eaf1;
      box-shadow: 0 5px 17px rgba(20,35,60,.05);
    }

    .user-message {
      align-self: flex-end;
      background: #172033;
      color: white;
    }

    .message strong {
      font-weight: 850;
    }

    /* CHAT ACTIONS */
    .chat-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 13px;
    }

    .action-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #eef2f7;
      color: #172033;
      border: 1px solid #dfe5ec;
    }

    .action-btn:hover {
      filter: brightness(.98);
    }

    .whatsapp-btn {
      background: #16a34a;
      color: white;
      border-color: #16a34a;
    }

    .onexbet-btn {
      background: #1264e8;
      color: white;
      border-color: #1264e8;
    }

    .melbet-btn {
      background: #f97316;
      color: white;
      border-color: #f97316;
    }

    .paripesa-btn {
      background: #075eea;
      color: white;
      border-color: #075eea;
    }

    /* INPUT */
    .input-area {
      margin-top: 18px;
      background: white;
      padding: 8px;
      border-radius: 17px;
      border: 1px solid #e1e7ef;
      display: flex;
      gap: 7px;
      box-shadow: 0 5px 18px rgba(20,35,60,.05);
    }

    .input-area input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 10px 9px;
      font-size: 15px;
      min-width: 0;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: #172033;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    /* PLATFORMS */
    .platform-title {
      text-align: center;
      margin: 27px 0 13px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #667085;
    }

    .platforms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .platform {
      text-decoration: none;
      border-radius: 16px;
      min-height: 75px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      color: white;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 7px 18px rgba(20,35,60,.12);
      transition: .18s ease;
    }

    .platform:hover {
      transform: translateY(-2px);
    }

    .platform span {
      font-size: 19px;
    }

    .onexbet {
      background: #1264e8;
    }

    .melbet {
      background: #f97316;
    }

    .paripesa {
      background: #075eea;
    }

    /* BOTTOM */
    .bottom {
      margin-top: 17px;
      display: grid;
      grid-template-columns: 1.5fr .9fr;
      gap: 9px;
      align-items: stretch;
    }

    .whatsapp-link {
      text-decoration: none;
      background: #16a34a;
      color: white;
      border-radius: 17px;
      padding: 17px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 7px 18px rgba(22,163,74,.18);
    }

    .promo {
      background: linear-gradient(135deg, #f5c542, #f59e0b);
      color: #3a2800;
      border-radius: 17px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 7px 18px rgba(245,158,11,.17);
    }

    .promo-label {
      display: block;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .promo-code {
      font-size: 27px;
      font-weight: 1000;
      letter-spacing: 2px;
      line-height: 1;
    }

    /* FILE AREA */
    .capture-box {
      margin-top: 13px;
      background: #f7f9fc;
      border: 1px dashed #cbd5e1;
      border-radius: 15px;
      padding: 13px;
    }

    .capture-label {
      display: block;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #475467;
      margin-bottom: 9px;
    }

    .capture-input {
      width: 100%;
      font-size: 12px;
    }

    .file-status {
      margin-top: 7px;
      text-align: center;
      font-size: 12px;
      color: #16a34a;
      font-weight: 700;
    }

    .note {
      margin-top: 9px;
      font-size: 11px;
      color: #98a2b3;
      text-align: center;
      line-height: 1.45;
    }

    .hidden {
      display: none !important;
    }

    /* RESPONSIVE */
    @media (max-width: 450px) {
      .page {
        padding: 13px 11px 25px;
      }

      .brand {
        font-size: 21px;
      }

      .intro {
        padding: 19px 14px;
      }

      .intro h1 {
        font-size: 19px;
      }

      .platform {
        min-height: 70px;
        font-size: 11.5px;
      }

      .promo-code {
        font-size: 24px;
      }

      .whatsapp-link {
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->

    >
      <span>🔵</span>
      1XBET
    </a>

    <a
      class="platform melbet"
      href="https://refpa3665.com/L?tag=d_4139550m_45415c_&site=4139550&ad=45415&r=registration"

    >

    </a>

    <a
      class="platform paripesa"
      href="https://paripesa.bet/christtpronoso"
      target="_blank"
      rel="noopener"
    >
      <span>🔵</span>
      PARIPESA
    </a>

  </div>

  <!-- BOTTOM -->
  <div class="bottom">

    <a
      class="whatsapp-link"
      href="https://whatsapp.com/channel/0029VbBw8FBDp2Q03qhB4t2b"
      target="_blank"
      rel="noopener"
    >
      📲 REJOINDRE MA CHAÎNE WHATSAPP
    </a>

    <div class="promo">
      <span class="promo-label">CODE PROMO</span>
      <span class="promo-code">8F9Y</span>
    </div>

  </div>

</div>


<script>

  const WHATSAPP_CHANNEL =
    "https://whatsapp.com/channel/0029VbBw8FBDp2Q03qhB4t2b";

  const LINKS = {
    "1xbet":
      "https://reffpa.com/L?tag=d_4215855m_97c_&site=4215855&ad=97&r=registration",

    "melbet":
      "https://refpa3665.com/L?tag=d_4139550m_45415c_&site=4139550&ad=45415&r=registration",

    "paripesa":
      "https://paripesa.bet/christtpronoso"
  };

  const messages = document.getElementById("messages");
  const chat = document.getElementById("chat");
  const actions = document.getElementById("chatActions");

  function showChat() {
    chat.classList.add("active");
    chat.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function clearChat() {
    messages.innerHTML = "";
    actions.innerHTML = "";
  }

  function addBot(text) {
    const div = document.createElement("div");
    div.className = "message bot-message";
    div.textContent = text;
    messages.appendChild(div);
  }

  function addUser(text) {
    const div = document.createElement("div");
    div.className = "message user-message";
    div.textContent = text;
    messages.appendChild(div);
  }

  function addButton(text, className, callback) {
    const button = document.createElement("button");

    button.className = "action-btn " + (className || "");
    button.textContent = text;

    button.onclick = callback;

    actions.appendChild(button);
  }

  function whatsappButton() {
    addButton(
      "📲 REJOINDRE MA CHAÎNE WHATSAPP",
      "whatsapp-btn",
      function() {
        window.open(WHATSAPP_CHANNEL, "_blank");
      }
    );
  }

  function platformButton(name, className) {

    addButton(
      name.toUpperCase(),
      className,
      function() {

        addUser(name.toUpperCase());

        addBot(
          "🤖 JEFF PRO\n\n" +
          "Parfait 👌 Tu as choisi " +
          name.toUpperCase() +
          ".\n\n" +
          "Utilise le bouton ci-dessous pour ouvrir " +
          "la page d'inscription."
        );

        actions.innerHTML = "";

        addButton(
          "🚀 OUVRIR " + name.toUpperCase(),
          className,
          function() {
            window.open(LINKS[name.toLowerCase()], "_blank");
          }
        );
      }
    );
  }

  /* APPLE */
  function openApple() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "Pour accéder aux méthodes et informations " +
      "réservées de JEFF PRO concernant Apple of Fortune, " +
      "tu dois d'abord remplir 2 conditions :\n\n" +

      "1️⃣ T'inscrire chez 1XBET, MELBET ou PARIPESA " +
      "avec le code promo 8F9Y.\n\n" +

      "2️⃣ Effectuer un premier dépôt d'au moins 1 500 FCFA.\n\n" +

      "🔥 Une fois ces étapes validées, tu pourras " +
      "bénéficier du contenu exclusif de JEFF PRO 🍎."
    );

    addButton(
      "👉 ME GUIDER ÉTAPE PAR ÉTAPE",
      "",
      function() {
        registrationGuide();
      }
    );
  }

  /* DICE */
  function openDice() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "Pour accéder aux méthodes et informations " +
      "réservées concernant le Jeu des Dés, tu dois " +
      "remplir 2 conditions :\n\n" +

      "1️⃣ Inscription chez 1XBET, MELBET ou PARIPESA " +
      "avec le code promo 8F9Y.\n\n" +

      "2️⃣ Premier dépôt d'au moins 1 500 FCFA.\n\n" +

      "🔥 Une fois les étapes validées, tu pourras " +
      "accéder au contenu réservé de JEFF PRO 🎲."
    );

    addButton(
      "👉 ME GUIDER ÉTAPE PAR ÉTAPE",
      "",
      function() {
        registrationGuide();
      }
    );
  }

  /* SCORE */
  function openScore() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "🎯 Les scores exacts du jour sont partagés " +
      "dans ma chaîne WhatsApp.\n\n" +
      "👉 Clique sur « Rejoindre ma chaîne WhatsApp » " +
      "ci-dessous pour accéder aux publications."
    );

    whatsappButton();
  }

  /* FIFA */
  function openFifa() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "⚽ Les informations et contenus FIFA sont " +
      "partagés dans ma chaîne WhatsApp.\n\n" +
      "👉 Clique sur « Rejoindre ma chaîne WhatsApp » " +
      "ci-dessous pour accéder aux publications."
    );

    whatsappButton();
  }

  /* POKER */
  function openPoker() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "🃏 Les informations et contenus concernant " +
      "les jeux Poker sont partagés dans ma chaîne WhatsApp.\n\n" +
      "👉 Clique sur « Rejoindre ma chaîne WhatsApp » " +
      "ci-dessous pour accéder aux publications."
    );

    whatsappButton();
  }

  /* GUIDE */
  function registrationGuide() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "Parfait 👌\n\n" +

      "ÉTAPE 1️⃣\n" +
      "Tu t'es déjà inscrit ?\n\n" +

      "📸 Envoie une capture d'écran de ton inscription " +
      "pour continuer."
    );

    createCapture("inscription");
  }

  /* REGISTRATION */
  function openRegistration() {

    clearChat();
    showChat();

    addBot(
      "🤖 JEFF PRO\n\n" +
      "ÉTAPE 1️⃣\n\n" +
      "Tu t'es déjà inscrit ?\n\n" +

      "📸 Envoie une capture d'écran de ton inscription " +
      "pour continuer."
    );

    createCapture("inscription");
  }

  function createCapture(step) {

    const box = document.createElement("div");
    box.className = "capture-box";

    const label = document.createElement("label");
    label.className = "capture-label";

    label.textContent =
      "📸 Sélectionner une capture d'écran";

    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.className = "capture-input";

    const status = document.createElement("div");
    status.className = "file-status";

    input.addEventListener("change", function() {

      if (!input.files || !input.files[0]) {
        return;
      }

      status.textContent =
        "✅ Capture sélectionnée : " +
        input.files[0].name;

      setTimeout(function() {
        nextStep(step);
      }, 600);

    });

    box.appendChild(label);
    box.appendChild(input);
    box.appendChild(status);

    const note = document.createElement("div");
    note.className = "note";
    note.textContent =
      "La capture est sélectionnée sur ton appareil. " +
      "Elle n'est pas envoyée automatiquement à Jeff Pro.";

    box.appendChild(note);

    actions.appendChild(box);
  }

  function nextStep(step) {

    actions.innerHTML = "";

    if (step === "inscription") {

      addBot(
        "🤖 JEFF PRO\n\n" +
        "ÉTAPE 2️⃣\n\n" +

        "Tu as bien utilisé le code promo 8F9Y ?\n\n" +

        "📸 Envoie une capture d'écran où l'on voit " +
        "que le code 8F9Y a bien été utilisé."
      );

      createCapture("code");

      return;
    }

    if (step === "code") {

      addBot(
        "🤖 JEFF PRO\n\n" +
        "ÉTAPE 3️⃣\n\n" +

        "Tu t'es inscrit sur quelle plateforme ?"
      );

      platformSelection();

      return;
    }

    if (step === "deposit") {

      addBot(
        "🤖 JEFF PRO\n\n" +
        "ÉTAPE 4️⃣\n\n" +

        "Tu as effectué ton dépôt de 1 500 FCFA ?\n\n" +

        "📸 Envoie une capture d'écran de ton dépôt " +
        "pour continuer."
      );

      createCapture("deposit");

      return;
    }
  }

  function platformSelection() {

    addButton(
      "🔵 1XBET",
      "onexbet-btn",
      function() {
        choosePlatform("1XBET");
      }
    );

    addButton(
      "🟠 MELBET",
      "melbet-btn",
      function() {
        choosePlatform("MELBET");
      }
    );

    addButton(
      "🔵 PARIPESA",
      "paripesa-btn",
      function() {
        choosePlatform("PARIPESA");
      }
    );
  }

  function choosePlatform(platform) {

    addUser(platform);

    actions.innerHTML = "";

    addBot(
      "🤖 JEFF PRO\n\n" +
      "Tu as choisi " + platform + ".\n\n" +
      "ÉTAPE 4️⃣\n\n" +
      "Tu as effectué ton dépôt de 1 500 FCFA ?\n\n" +
      "📸 Envoie une capture d'écran de ton dépôt " +
      "pour continuer."
    );

    createCapture("deposit");
  }

  /* FIN DU PARCOURS */
  function finishRegistration() {

    actions.innerHTML = "";

    addBot(
      "🤖 JEFF PRO\n\n" +
      "Parfait 👌\n\n" +
      "Toutes les étapes sont terminées.\n\n" +
      "📲 Maintenant, rejoins ma chaîne WhatsApp " +
      "pour accéder aux publications de JEFF PRO."
    );

    whatsappButton();
  }

  /*
    On modifie createCapture pour terminer
    le parcours après la capture du dépôt.
  */

  const originalCreateCapture = createCapture;

  createCapture = function(step) {

    const box = document.createElement("div");
    box.className = "capture-box";

    const label = document.createElement("label");
    label.className = "capture-label";
    label.textContent =
      "📸 Sélectionner une capture d'écran";

    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.className = "capture-input";

    const status = document.createElement("div");
    status.className = "file-status";

    input.addEventListener("change", function() {

      if (!input.files || !input.files[0]) {
        return;
      }

      status.textContent =
        "✅ Capture sélectionnée : " +
        input.files[0].name;

      setTimeout(function() {

        if (step === "deposit") {
          finishRegistration();
        } else {
          nextStep(step);
        }

      }, 600);

    });

    box.appendChild(label);
    box.appendChild(input);
    box.appendChild(status);

    const note = document.createElement("div");
    note.className = "note";
    note.textContent =
      "La capture est sélectionnée sur ton appareil. " +
      "Elle n'est pas envoyée automatiquement à Jeff Pro.";

    box.appendChild(note);

    actions.appendChild(box);
  };
