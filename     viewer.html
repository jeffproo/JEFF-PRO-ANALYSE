let selected=0,amount=400,conn=null,peer=null;const cards=[card1,card2,card3],radios=[r1,r2,r3],stakeEl=stake,toastEl=toast;function msg(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.tm);window.tm=setTimeout(()=>toastEl.classList.remove('show'),1200)}function select(i){selected=i;cards.forEach((c,n)=>c.classList.toggle('selected',n===i));radios.forEach((r,n)=>r.classList.toggle('active',n===i));msg(['Plus de 7','Égal 7','Moins de 7'][i])}function applyChoice(c,show=true){const map={plus:0,equal:1,minus:2};if(map[c]!==undefined)select(map[c]);if(show&&map[c]!==undefined)msg('Choix reçu : '+['PLUS DE 7','ÉGAL À 7','MOINS DE 7'][map[c]])}function read(){let v=parseInt(String(stakeEl.value).replace(/\D/g,''),10);if(!Number.isFinite(v)||v<1)v=1;amount=v;stakeEl.value=v+' XOF';return v}function set(v){amount=Math.max(1,Math.floor(v));stakeEl.value=amount+' XOF'}min.onclick=()=>{set(1);msg('MIN')};x2.onclick=()=>{set(read()*2);msg('X2')};half.onclick=()=>{set(Math.max(1,Math.floor(read()/2)));msg('X/2')};max.onclick=()=>{set(1000000);msg('MAX')};stakeEl.onclick=()=>{stakeEl.value=amount;stakeEl.select()};stakeEl.onblur=read;coins.onclick=()=>msg('Pièces');play.onclick=()=>msg(['PLUS DE 7','ÉGAL À 7','MOINS DE 7'][selected]+' • '+amount+' XOF');reset.onclick=()=>{set(400);select(0);msg('Réinitialisé')};function initPeer(){peer=new Peer();peer.on('open',id=>{connStatus.textContent='Prêt — code du téléphone 2 : '+id});peer.on('error',e=>{connStatus.textContent='⚠️ '+e.type})}join.onclick=()=>{const id=controllerId.value.trim();if(!id)return connStatus.textContent='Entre le code du téléphone 1';conn=peer.connect(id);conn.on('open',()=>{connectPanel.style.display='none';msg('🟢 Téléphone 1 connecté')});conn.on('data',data=>{if(data.type==='sync')applyChoice(data.choice,false);if(data.type==='predict'){applyChoice(data.choice,false);msg('▶ PRÉDIRE');setTimeout(()=>msg('Résultat affiché !'),700)}if(data.type==='reset'){set(400);select(0);msg('↻ Réinitialisé')}});conn.on('close',()=>{connectPanel.style.display='flex';connStatus.textContent='Téléphone 1 déconnecté'});conn.on('error',()=>connStatus.textContent='⚠️ Erreur de connexion')};initPeer();select(0);
