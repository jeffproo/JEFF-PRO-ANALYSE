<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Téléphone 1 — Contrôleur</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#070b14;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(520px,100%);background:linear-gradient(180deg,#101a2b,#0a101c);border:1px solid #28456f;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}h1{font-size:22px;margin:0 0 6px}.sub{color:#9eb1cc;font-size:14px;margin-bottom:18px}.status{padding:12px;border-radius:14px;background:#111e31;border:1px solid #29466f;margin-bottom:16px;font-size:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffb020;margin-right:7px}.dot.ok{background:#39e56f}.code{font-size:27px;font-weight:900;letter-spacing:3px;text-align:center;background:#070c15;border:1px dashed #4775b5;border-radius:16px;padding:15px;margin:10px 0 16px;user-select:text}label{display:block;font-size:13px;color:#aebed4;margin:12px 0 7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #34547f;background:#070c15;color:#fff;font-size:16px;outline:none}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:800;cursor:pointer}.connect{background:#2678ff;color:#fff}.choice{background:#18263b;color:#fff;border:1px solid #35557e}.choice.active{background:#1f7a46;border-color:#51e08a}.predict{background:#a8ff22;color:#071000;font-size:19px;padding:18px;box-shadow:0 8px 24px #a8ff2233}.reset{background:#202b3d;color:#b9c7da}.hint{font-size:12px;color:#8296b3;line-height:1.45;margin-top:14px;text-align:center}#msg{min-height:20px;text-align:center;color:#a8ff22;font-weight:700;margin-top:12px}</style></head><body><main class="panel"><h1>📱 Téléphone 1 — Contrôleur</h1><div class="sub">Choisis une option puis appuie sur PRÉDIRE.</div><div class="status"><span id="dot" class="dot"></span><span id="status">Création de la salle…</span></div><div class="code" id="room">…</div><label>Code du téléphone 2</label><input id="remote" placeholder="Entre le code du téléphone 2" autocomplete="off"><button class="connect" id="connect">🔗 Connecter</button><div style="margin-top:16px"><button class="choice active" data-choice="plus">🟢 PLUS DE 7</button><button class="choice" data-choice="equal">🟡 ÉGAL À 7</button><button class="choice" data-choice="minus">🔴 MOINS DE 7</button></div><button class="predict" id="predict">▶ PRÉDIRE</button><button class="reset" id="reset">↻ Réinitialiser</button><div id="msg"></div><div class="hint">Connexion en temps réel via WebRTC/PeerJS. Les deux téléphones doivent avoir Internet.</div></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const $=id=>document.getElementById(id);let peer,conn=null,choice='plus';const labels={plus:'PLUS DE 7',equal:'ÉGAL À 7',minus:'MOINS DE 7'};function status(t,ok=false){$('status').textContent=t;$('dot').classList.toggle('ok',ok)}function send(o){if(conn&&conn.open){conn.send(o);return true}$('msg').textContent='⚠️ Téléphone 2 non connecté';return false}function setChoice(c){choice=c;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.choice===c));$('msg').textContent=labels[c]}function makePeer(){const id='JEFF-'+Math.random().toString(36).slice(2,6).toUpperCase();peer=new Peer(id);peer.on('open',id=>{$('room').textContent=id;status('Salle prête — en attente du téléphone 2')});peer.on('connection',c=>{conn=c;status('Téléphone 2 connecté',true);$('msg').textContent='🟢 Connexion établie';c.on('close',()=>{status('Téléphone 2 déconnecté');conn=null})});peer.on('error',e=>{status('Erreur de connexion');$('msg').textContent='⚠️ '+e.type})}$('connect').onclick=()=>{const id=$('remote').value.trim();if(!id)return $('msg').textContent='Entre le code du téléphone 2';if(!peer)return;conn=peer.connect(id);conn.on('open',()=>{status('Téléphone 2 connecté',true);$('msg').textContent='🟢 Connexion établie';send({type:'sync',choice})});conn.on('close',()=>{status('Téléphone 2 déconnecté');conn=null});conn.on('error',()=>status('Erreur de connexion'))};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setChoice(b.dataset.choice));$('predict').onclick=()=>{if(send({type:'predict',choice}))$('msg').textContent='▶ '+labels[choice]+' envoyé'};$('reset').onclick=()=>{send({type:'reset'});$('msg').textContent='↻ Réinitialisé'};makePeer();
</script></body></html>
