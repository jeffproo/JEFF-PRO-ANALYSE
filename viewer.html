<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Interface</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#viewport{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:hidden;
    background:#000;
}

#stage{
    position:relative;
    width:100vw;
    max-width:571px;
    aspect-ratio:571/1280;
    flex:none;
    background:#2e2d42;
    overflow:hidden;
}

#bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
}

.zone{
    position:absolute;
    z-index:5;
    border:0;
    background:transparent;
    padding:0;
    cursor:pointer;
}

.zone:active{
    filter:brightness(1.25);
}

/* CHOIX */

.choice{
    top:49.2%;
    height:7.45%;
}

#c1{
    left:9.6%;
    width:24.9%;
}

#c2{
    left:37.4%;
    width:24.9%;
}

#c3{
    left:65.3%;
    width:25.1%;
}

/* POINT DE SELECTION */

#marker{
    position:absolute;
    z-index:9;

    width:4.4%;
    aspect-ratio:1;

    border-radius:50%;

    border:2px solid #e9d18b;

    background:#171522;

    box-shadow:
        0 0 0 2px rgba(0,0,0,.75),
        0 0 7px rgba(255,226,143,.35);

    pointer-events:none;

    transition:
        left .18s ease,
        top .18s ease;
}

/* CONTROLES */

#min{
    left:4.3%;
    top:58.45%;
    width:20.6%;
    height:4.7%;
}

#x2{
    left:26%;
    top:58.45%;
    width:20.6%;
    height:4.7%;
}

#half{
    left:48%;
    top:58.45%;
    width:20.6%;
    height:4.7%;
}

#max{
    left:70.3%;
    top:58.45%;
    width:25%;
    height:4.7%;
}

/* MISE */

#stake{
    position:absolute;
    z-index:12;

    left:4.4%;
    top:64.35%;

    width:34.5%;
    height:5%;

    border:0;
    background:transparent;

    color:#fff;

    font-weight:700;
    font-size:clamp(15px,4.2vw,25px);

    text-align:center;

    outline:none;
    padding:0;
}

/* BOUTONS BAS */

#coins{
    left:10.8%;
    top:70%;
    width:21%;
    height:10.2%;
}

#play{
    left:35.5%;
    top:69.7%;
    width:29%;
    height:10.8%;
}

#reset{
    left:71%;
    top:70%;
    width:20.5%;
    height:10.2%;
}

/* MESSAGE */

#toast{
    position:absolute;
    z-index:30;

    left:50%;
    bottom:3%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.88);

    color:#fff;

    border-radius:12px;

    padding:8px 12px;

    font-size:13px;
    font-weight:700;

    opacity:0;

    transition:opacity .2s;

    pointer-events:none;

    white-space:nowrap;
}

#toast.show{
    opacity:1;
}
</style>
</head>

<body>

<div id="viewport">

<div id="stage">

<!-- IMAGE INTÉGRÉE DIRECTEMENT -->
<img
id="bg"
src="interface-sans-demo.jpg..jpg"
alt="Interface"
>

<!-- POINT -->
<div id="marker"></div>

<!-- CHOIX -->

<button
class="zone choice"
id="c1">
</button>

<button
class="zone choice"
id="c2">
</button>

<button
class="zone choice"
id="c3">
</button>

<!-- CONTROLES -->

<button
class="zone"
id="min">
</button>

<button
class="zone"
id="x2">
</button>

<button
class="zone"
id="half">
</button>

<button
class="zone"
id="max">
</button>

<!-- MISE -->

<input
id="stake"
value="400 XOF"
inputmode="numeric"
>

<!-- BOUTONS -->

<button
class="zone"
id="coins">
</button>

<button
class="zone"
id="play">
</button>

<button
class="zone"
id="reset">
</button>

<div id="toast"></div>

</div>
</div>

<script>

const marker =
document.getElementById('marker');

const stake =
document.getElementById('stake');

const toast =
document.getElementById('toast');

let amount = 400;

let selected = 0;


/* POSITIONS DU POINT */

const cards = [

{
    x:11.6,
    y:54.0
},

{
    x:39.5,
    y:54.0
},

{
    x:67.4,
    y:54.0
}

];


/* MESSAGE */

function show(text){

    toast.textContent = text;

    toast.classList.add('show');

    clearTimeout(window.tt);

    window.tt = setTimeout(

        () => toast.classList.remove('show'),

        1300

    );
}


/* DEPLACEMENT DU POINT */

function moveMarker(index){

    selected = index;

    marker.style.left =
        cards[index].x + '%';

    marker.style.top =
        cards[index].y + '%';

    show(
        [
            'Plus de 7',
            'Égal 7',
            'Moins de 7'
        ][index]
    );
}


/* LIRE LA MISE */

function readAmount(){

    let value = parseInt(

        String(stake.value)
        .replace(/[^0-9]/g,''),

        10

    );

    if(
        !Number.isFinite(value)
        ||
        value < 1
    ){

        value = 1;

    }

    amount = value;

    stake.value =
        value + ' XOF';

    return value;
}


/* MODIFIER LA MISE */

function setAmount(value){

    amount =
        Math.max(
            1,
            Math.floor(value)
        );

    stake.value =
        amount + ' XOF';
}


/* CHOIX */

document.getElementById('c1')
.onclick = function(){

    moveMarker(0);

};


document.getElementById('c2')
.onclick = function(){

    moveMarker(1);

};


document.getElementById('c3')
.onclick = function(){

    moveMarker(2);

};


/* MIN */

document.getElementById('min')
.onclick = function(){

    setAmount(1);

    show('Mise minimale');

};


/* X2 */

document.getElementById('x2')
.onclick = function(){

    setAmount(
        readAmount() * 2
    );

    show('Mise ×2');

};


/* X/2 */

document.getElementById('half')
.onclick = function(){

    setAmount(

        Math.max(
            1,
            Math.floor(
                readAmount() / 2
            )
        )

    );

    show('Mise ÷2');

};


/* MAX */

document.getElementById('max')
.onclick = function(){

    setAmount(1000000);

    show('Mise maximale');

};


/* CHAMP DE MISE */

stake.onclick = function(){

    stake.select();

};


stake.onfocus = function(){

    stake.value =
        String(amount);

};


stake.onblur = function(){

    readAmount();

};


stake.onkeydown = function(event){

    if(event.key === 'Enter'){

        readAmount();

        stake.blur();

    }

};


/* BOUTON PIÈCES */

document.getElementById('coins')
.onclick = function(){

    show('Bouton pièces');

};


/* JOUER */

document.getElementById('play')
.onclick = function(){

    show(

        'Sélection : ' +

        [
            'Plus de 7',
            'Égal 7',
            'Moins de 7'
        ][selected]

        +

        ' • ' +

        amount +

        ' XOF'

    );

};


/* RESET */

document.getElementById('reset')
.onclick = function(){

    setAmount(400);

    moveMarker(0);

    show('Réinitialisé');

};


/* POSITION INITIALE */

moveMarker(0);

</script>

</body>
</html>
