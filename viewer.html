<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interface</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;background:#080b12;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  .app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#080b12}
  video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;background:#080b12;
    user-select:none;pointer-events:none;
  }

  /* Couche interactive : transparente, donc la vidéo reste inchangée. */
  .ui{position:absolute;inset:0;z-index:10}
  .zone{position:absolute;border:0;background:transparent;cursor:pointer}
  .zone:active{background:rgba(255,255,255,.03)}

  /* Ces zones suivent une disposition verticale type téléphone.
     Elles sont exprimées en pourcentage pour rester responsives. */
  #plus7   {left:4%;right:67%;top:49%;height:10%}
  #egal7   {left:35%;right:35%;top:49%;height:10%}
  #moins7  {left:67%;right:4%;top:49%;height:10%}

  #min     {left:5%;width:19%;top:67%;height:7%}
  #x2      {left:29%;width:18%;top:67%;height:7%}
  #half    {left:52%;width:18%;top:67%;height:7%}
  #max     {right:5%;width:19%;top:67%;height:7%}

  #stakeZone{left:25%;right:25%;top:74%;height:7%}
  #play     {left:35%;right:35%;top:82%;height:9%}
  #reset    {left:70%;width:25%;top:82%;height:9%}

  /* Sélection visuelle, sans toucher à la vidéo. */
  .selection{
    position:absolute;z-index:12;display:none;
    width:14px;height:14px;border-radius:50%;
    background:#20e060;box-shadow:0 0 0 3px rgba(32,224,96,.18);
    pointer-events:none;transform:translate(-50%,-50%);
  }
  .selection.show{display:block}
  #selPlus{left:16%;top:54%}
  #selEgal{left:50%;top:54%}
  #selMoins{left:84%;top:54%}

  /* Montant interactif : le champ se pose au-dessus du montant visible
     dans la vidéo. Il reste volontairement discret. */
  .stakeWrap{
    position:absolute;z-index:13;left:25%;right:25%;top:74%;
    height:7%;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #stake{
    pointer-events:auto;width:100%;height:100%;
    border:0;outline:0;background:transparent;color:transparent;
    text-align:center;font-size:clamp(18px,5vw,32px);font-weight:700;
    caret-color:#fff;
  }
  #stake::selection{background:rgba(255,255,255,.25)}

  /* Petit panneau d'état uniquement lorsque l'utilisateur interagit. */
  .toast{
    position:absolute;z-index:20;left:50%;bottom:3%;
    transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:9px 14px;border-radius:999px;
    background:rgba(0,0,0,.72);color:#fff;font-size:13px;font-weight:700;
    transition:.2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* Sur écran très étroit, on élargit légèrement les zones. */
  @media(max-width:380px){
    #plus7{left:2%;right:66%} #egal7{left:33%;right:33%} #moins7{left:66%;right:2%}
  }

  /* Accessibilité : les boutons restent invisibles visuellement. */
  button{appearance:none}

  #connectPanel{position:absolute;z-index:100;inset:0;background:rgba(3,7,14,.94);display:flex;align-items:center;justify-content:center;padding:22px}
  .connectBox{width:min(430px,100%);background:#101a2b;border:1px solid #34557f;border-radius:22px;padding:22px;color:#fff;box-shadow:0 20px 60px #000}
  .connectBox h2{margin:0 0 8px;font-size:21px}.connectBox p{color:#aebed4;font-size:14px;line-height:1.4}
  .connectBox input{width:100%;padding:14px;border-radius:12px;border:1px solid #34547f;background:#070c15;color:#fff;font-size:17px;text-transform:uppercase;outline:none}
  .connectBox button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:13px;background:#2678ff;color:#fff;font-weight:800;font-size:16px}
  #connStatus{text-align:center;margin-top:12px;color:#a8ff22;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div id="connectPanel"><div class="connectBox">
    <h2>📱 Téléphone 2 — Jeu</h2>
    <p>Entre le code affiché sur le téléphone 1 pour connecter les deux appareils.</p>
    <input id="controllerId" placeholder="Ex. JEFF-AB12" autocomplete="off">
    <button id="join">🔗 Connecter</button>
    <div id="connStatus">Connexion en attente…</div>
  </div></div>

  <video id="gameVideo"
         src="jeu.mp4.mp4"
         playsinline
         preload="auto"
         muted></video>

  <div class="ui" aria-label="Interface interactive">
    <button class="zone" id="plus7" aria-label="Plus de 7"></button>
    <button class="zone" id="egal7" aria-label="Égal 7"></button>
    <button class="zone" id="moins7" aria-label="Moins de 7"></button>

    <button class="zone" id="min" aria-label="Montant minimum"></button>
    <button class="zone" id="x2" aria-label="Doubler le montant"></button>
    <button class="zone" id="half" aria-label="Diviser le montant par deux"></button>
    <button class="zone" id="max" aria-label="Montant maximum"></button>

    <div class="stakeWrap">
      <input id="stake" type="number" inputmode="numeric" min="1" max="100000" aria-label="Montant">
    </div>

    <button class="zone" id="play" aria-label="Jouer"></button>
    <button class="zone" id="reset" aria-label="Réinitialiser"></button>

    <span class="selection" id="selPlus"></span>
    <span class="selection" id="selEgal"></span>
    <span class="selection" id="selMoins"></span>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(() => {
  const video=document.getElementById('gameVideo'), stake=document.getElementById('stake'), toast=document.getElementById('toast');
  const panel=document.getElementById('connectPanel'), controllerId=document.getElementById('controllerId'), join=document.getElementById('join'), connStatus=document.getElementById('connStatus');
  const sel={plus:document.getElementById('selPlus'),egal:document.getElementById('selEgal'),moins:document.getElementById('selMoins')};
  let choice=null, peer=null, conn=null;
  function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1300)}
  function clearSelection(){Object.values(sel).forEach(x=>x.classList.remove('show'));choice=null}
  function choose(which,notify=true){clearSelection();choice=which;sel[which].classList.add('show');if(notify)showToast(which==='plus'?'Plus de 7 sélectionné':which==='egal'?'Égal à 7 sélectionné':'Moins de 7 sélectionné')}
  function apply(which){if(['plus','egal','moins'].includes(which))choose(which,false)}
  document.getElementById('plus7').onclick=()=>choose('plus');document.getElementById('egal7').onclick=()=>choose('egal');document.getElementById('moins7').onclick=()=>choose('moins');
  document.getElementById('min').onclick=()=>{stake.value=100;showToast('Minimum : 100')};document.getElementById('max').onclick=()=>{stake.value=100000;showToast('Maximum : 100 000')};
  document.getElementById('x2').onclick=()=>{const n=Number(stake.value||0);stake.value=Math.min(100000,Math.max(1,n*2))};
  document.getElementById('half').onclick=()=>{const n=Number(stake.value||0);stake.value=Math.max(1,Math.floor(n/2))};
  stake.addEventListener('input',()=>{let n=Number(stake.value||0);if(n>100000)n=100000;if(n<0)n=0;stake.value=n||''});
  document.getElementById('play').onclick=async()=>{if(!choice){showToast('Choisis une option');return}if(!Number(stake.value||0)){showToast('Entre un montant');stake.focus();return}try{video.currentTime=0;await video.play()}catch(e){showToast('Appuie encore sur Jouer')}};
  document.getElementById('reset').onclick=()=>{video.pause();video.currentTime=0;clearSelection();stake.value='';showToast('Réinitialisé')};
  function connect(){const id=controllerId.value.trim().toUpperCase();if(!id)return connStatus.textContent='Entre le code du téléphone 1';if(!peer)return connStatus.textContent='Initialisation…';connStatus.textContent='Connexion…';conn=peer.connect(id,{reliable:true});conn.on('open',()=>{panel.style.display='none';showToast('🟢 Téléphone 1 connecté');connStatus.textContent='Connecté'});conn.on('data',async d=>{if(d.type==='sync')apply(d.choice);if(d.type==='predict'){apply(d.choice);try{video.currentTime=0;await video.play()}catch(e){showToast('Appuie sur Jouer')}}if(d.type==='reset'){video.pause();video.currentTime=0;clearSelection();stake.value='';showToast('↻ Réinitialisé')}});conn.on('close',()=>{panel.style.display='flex';connStatus.textContent='Téléphone 1 déconnecté'});conn.on('error',()=>connStatus.textContent='⚠️ Erreur de connexion')}
  join.onclick=connect;controllerId.addEventListener('keydown',e=>{if(e.key==='Enter')connect()});
  peer=new Peer();peer.on('open',id=>{connStatus.textContent='Prêt — entre le code du téléphone 1'});peer.on('error',e=>{connStatus.textContent='⚠️ '+(e.type||'Erreur')});
  video.addEventListener('loadedmetadata',()=>{video.currentTime=0});document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
</body>
</html>
