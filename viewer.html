<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEFF PRO — DÉS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#552879;
 color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}

.game{
 max-width:430px;
 margin:auto;
 min-height:100vh;
 padding:28px 22px;
 background:
 linear-gradient(
   180deg,
   #74469a 0%,
   #552879 100%
 );
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.back{
 font-size:25px;
}

.balance{
 background:#ffffff22;
 padding:9px 14px;
 border-radius:18px;
 font-size:13px;
}

.place{
 margin-top:35px;
 text-align:center;
 font-size:13px;
 font-weight:bold;
}

.dices{
 display:flex;
 justify-content:center;
 gap:20px;
 margin-top:25px;
}

.die{
 width:105px;
 height:105px;
 border-radius:50%;
 background:#f4e8ee;
 border:8px solid #ffb52d;
 display:flex;
 justify-content:center;
 align-items:center;
 color:#6b3866;
 font-size:40px;
 font-weight:900;
 box-shadow:0 7px 20px #0005;
}

.options{
 display:flex;
 gap:8px;
 margin-top:18px;
}

.option{
 flex:1;
 padding:11px 4px;
 border:2px solid #e8b13b;
 border-radius:9px;
 background:#75418c;
 color:#fff;
 font-size:11px;
 font-weight:bold;
}

.option.active{
 background:#a26a20;
}

.controls{
 display:flex;
 gap:8px;
 margin-top:14px;
}

.controls button{
 flex:1;
 border:0;
 border-radius:7px;
 padding:12px 3px;
 background:#f0a52a;
 color:#633b00;
 font-weight:900;
}

.amount{
 margin:12px auto;
 width:120px;
 padding:10px;
 text-align:center;
 border:2px solid #d8a83e;
 border-radius:7px;
 background:#633578;
 font-weight:bold;
}

.bottom{
 display:flex;
 justify-content:center;
 gap:16px;
 margin-top:5px;
}

.bottom button{
 width:58px;
 height:58px;
 border-radius:10px;
 border:2px solid #dcae47;
 font-size:24px;
}

.money{background:#4261df;color:#fff}
.play{background:#67ed17;color:#164800}
.reset{background:#4164e6;color:#fff}

.received{
 margin-top:18px;
 text-align:center;
 font-size:11px;
 color:#ddd;
}

.received strong{
 display:block;
 margin-top:5px;
 font-size:20px;
 color:#fff200;
}

.status{
 text-align:center;
 margin-top:15px;
 font-size:11px;
 color:#ddd;
}

@keyframes roll{
 0%{transform:rotate(0) scale(1)}
 50%{transform:rotate(15deg) scale(1.08)}
 100%{transform:rotate(0) scale(1)}
}

.roll{
 animation:roll .8s ease;
}
</style>
</head>

<body>

<div class="game">

<div class="top">
<div class="back">‹</div>
<div class="balance">💰 2 000 XOF</div>
</div>

<div class="place">
Placez un pari
</div>

<div class="dices">

<div id="die1" class="die">?</div>
<div id="die2" class="die">?</div>

</div>

<div class="options">

<button id="plus" class="option">
🟡 Plus de 7<br>× 2.3
</button>

<button class="option">
🟤 Égal 7<br>× 5.6
</button>

<button id="moins" class="option">
🟠 Moins de 7<br>× 2.3
</button>

</div>

<div class="controls">

<button>MIN</button>
<button>X2</button>
<button>X/2</button>
<button>MAX</button>

</div>

<div class="amount">
2000 XOF
</div>

<div class="bottom">

<button class="money">▤</button>

<button id="play" class="play">▶</button>

<button class="reset">↻</button>

</div>

<div class="received">
PRÉDICTION REÇUE
<strong id="prediction">—</strong>
</div>

<div id="status" class="status">
En attente du téléphone 1…
</div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

const peer = new Peer();

const status =
document.getElementById("status");

const prediction =
document.getElementById("prediction");

const die1 =
document.getElementById("die1");

const die2 =
document.getElementById("die2");


peer.on("open", id => {

 status.textContent =
 "🟢 ID du téléphone 2 : " + id;

});


peer.on("connection", connection => {

 connection.on("open", () => {

   status.textContent =
   "🟢 Téléphone 1 connecté";

 });

 connection.on("data", message => {

   if(message.type === "demo"){

     prediction.textContent =
     message.value;

     status.textContent =
     "⚡ Nouvelle valeur reçue";

     if(message.value === "PLUS DE 7"){

       document
       .getElementById("plus")
       .classList.add("active");

       document
       .getElementById("moins")
       .classList.remove("active");

     }

     if(message.value === "MOINS DE 7"){

       document
       .getElementById("moins")
       .classList.add("active");

       document
       .getElementById("plus")
       .classList.remove("active");

     }

     if(message.value === "ÉGAL 7"){

       document
       .getElementById("plus")
       .classList.remove("active");

       document
       .getElementById("moins")
       .classList.remove("active");

     }

   }

 });

});


/* Bouton vert : lancer la simulation */

document.getElementById("play").onclick =
function(){

 die1.classList.add("roll");
 die2.classList.add("roll");

 setTimeout(() => {

   die1.textContent =
   1 + Math.floor(Math.random()*6);

   die2.textContent =
   1 + Math.floor(Math.random()*6);

   die1.classList.remove("roll");
   die2.classList.remove("roll");

 },800);

};

</script>

</body>
</html>
