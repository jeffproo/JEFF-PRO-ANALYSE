<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeu des Dés</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 background:#2d2d40;
 font-family:Arial,sans-serif;
 color:#fff;
}

body{
 min-height:100vh;
}

.game{
 max-width:430px;
 min-height:100vh;
 margin:auto;
 background:
 radial-gradient(circle at 50% 38%,#414154,#29293b 70%);
 overflow:hidden;
}

/* HAUT */

.top{
 height:153px;
 background:#fff;
 display:flex;
 align-items:center;
 padding:0 15px;
 gap:9px;
 color:#416b88;
}

.back{
 font-size:43px;
 width:38px;
}

.balanceWrap{
 display:flex;
 align-items:center;
 gap:5px;
 flex:1;
 justify-content:center;
}

.balance{
 min-width:215px;
 height:48px;
 padding:8px 12px;
 border-radius:16px;
 border:5px solid #b9b9bd;
 background:#74747b;
 color:white;
 font-size:18px;
 font-weight:800;
 text-align:center;
}

.plus{
 width:50px;
 height:50px;
 border:0;
 border-radius:14px;
 background:#22bd58;
 color:#fff;
 font-size:33px;
}

.topIcon{
 width:43px;
 height:43px;
 border:0;
 border-radius:8px;
 background:#47769e;
 color:white;
 font-size:10px;
 font-weight:900;
}

/* CONTENU */

.content{
 position:relative;
 padding:128px 22px 55px;
}

.choose{
 height:55px;
 margin-left:68px;
 border:2px solid #5c5871;
 border-radius:8px;
 background:#393847;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:17px;
 font-weight:700;
}

.help{
 position:absolute;
 top:128px;
 left:22px;
 width:73px;
 height:73px;
 border-radius:11px;
 border:4px solid #17151e;
 background:linear-gradient(#ffcf5a,#9b6b14);
 box-shadow:
 inset 0 0 0 3px #e5b94c,
 0 4px 8px #0008;
 color:#fff;
 font-size:32px;
 font-weight:900;
}

/* DÉS */

.dices{
 display:flex;
 justify-content:center;
 gap:24px;
 margin-top:55px;
}

.die{
 width:164px;
 height:164px;
 border-radius:50%;
 border:9px solid #dfbd6b;
 background:
 radial-gradient(circle at 34% 24%,#fff,#e8e8e8 48%,#c6c6c6);
 box-shadow:
 0 0 0 6px #11111a,
 inset 0 -12px 18px #8888,
 0 7px 13px #0008;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
}

.die:before{
 content:"";
 position:absolute;
 inset:9px;
 border-radius:50%;
 border:3px solid #fff8;
}

.face{
 position:relative;
 width:82px;
 height:82px;
}

.pip{
 position:absolute;
 width:13px;
 height:13px;
 border-radius:50%;
 background:#17171d;
}

.p1{left:34px;top:34px}

.p2a{left:8px;top:8px}
.p2b{right:8px;bottom:8px}

.p3a{left:8px;top:8px}
.p3b{left:34px;top:34px}
.p3c{right:8px;bottom:8px}

.p4a{left:8px;top:8px}
.p4b{right:8px;top:8px}
.p4c{left:8px;bottom:8px}
.p4d{right:8px;bottom:8px}

.p5a{left:8px;top:8px}
.p5b{right:8px;top:8px}
.p5c{left:34px;top:34px}
.p5d{left:8px;bottom:8px}
.p5e{right:8px;bottom:8px}

.p6a{left:8px;top:8px}
.p6b{right:8px;top:8px}
.p6c{left:8px;top:34px}
.p6d{right:8px;top:34px}
.p6e{left:8px;bottom:8px}
.p6f{right:8px;bottom:8px}

/* CHOIX */

.options{
 display:flex;
 gap:9px;
 margin-top:22px;
}

.option{
 flex:1;
 height:96px;
 border:3px solid #5e6b82;
 border-radius:8px;
 background:#363643;
 color:#e4cf9a;
 font-size:16px;
 font-weight:800;
}

.option span{
 display:block;
 color:#fff;
 font-size:20px;
 margin-top:8px;
}

.option.active{
 border-color:#ffd34e;
 box-shadow:0 0 12px #ffd34e66;
 background:#4b4635;
}

/* CONTROLES */

.controls{
 display:flex;
 gap:16px;
 margin-top:21px;
}

.control{
 flex:1;
 height:56px;
 border:3px solid #6c6654;
 border-radius:8px;
 background:
 linear-gradient(#fff1b5,#d4b45f 55%,#9b7b35);
 color:#332d22;
 font-size:20px;
}

/* MISE */

.amount{
 width:195px;
 height:60px;
 margin-top:23px;
 border:4px solid #a1874c;
 border-radius:8px;
 background:#171725;
 color:#fff;
 font-size:20px;
 font-weight:800;
 text-align:center;
 outline:none;
}

.amount:focus{
 border-color:#e3c36d;
}

/* BAS */

.bottom{
 display:flex;
 justify-content:center;
 gap:24px;
 margin-top:9px;
}

.bottom button{
 width:112px;
 height:112px;
 border-radius:25px;
 border:5px solid #15151d;
 box-shadow:
 0 4px 7px #0008,
 inset 0 0 0 4px #8f7543;
 font-size:51px;
}

.coins{
 background:linear-gradient(#5378ff,#294fd4);
 color:#fff;
}

.play{
 background:linear-gradient(#9bea48,#56bd18);
 color:#fff;
}

.reset{
 background:linear-gradient(#557cff,#3155d8);
 color:#fff;
}

/* ANIMATION */

@keyframes roll{
 0%,100%{transform:rotate(0) scale(1)}
 25%{transform:rotate(-10deg) scale(1.06)}
 50%{transform:rotate(10deg) scale(1.1)}
 75%{transform:rotate(-7deg) scale(1.05)}
}

.rolling{
 animation:roll .8s ease;
}

@media(max-width:390px){

 .balance{
  min-width:175px;
  font-size:15px;
 }

 .die{
  width:140px;
  height:140px;
 }

 .content{
  padding-left:15px;
  padding-right:15px;
 }

 .help{
  left:15px;
 }

 .choose{
  margin-left:58px;
 }

 .bottom button{
  width:90px;
  height:90px;
 }
}
</style>
</head>

<body>

<div class="game">

<header class="top">

<div class="back">‹</div>

<div class="balanceWrap">

<div class="balance">
17 396 655.03 F
</div>

<button class="plus">+</button>

</div>

<button class="topIcon">◈</button>

</header>


<main class="content">

<div class="choose">
Choisissez votre cote
</div>

<button class="help">?</button>


<div class="dices">

<div id="die1" class="die"></div>
<div id="die2" class="die"></div>

</div>


<div class="options">

<button id="plus7" class="option">
Plus de 7
<span>◉ × 2.3</span>
</button>

<button id="equal7" class="option">
Égal 7
<span>◉ × 5.8</span>
</button>

<button id="less7" class="option">
Moins de 7
<span>◉ × 2.3</span>
</button>

</div>


<div class="controls">

<button id="min" class="control">MIN</button>
<button id="x2" class="control">X2</button>
<button id="half" class="control">X/2</button>
<button id="max" class="control">MAX</button>

</div>


<input
 id="amount"
 class="amount"
 value="400 XOF"
 inputmode="numeric"
>


<div class="bottom">

<button id="coins" class="coins">
🪙
</button>

<button id="play" class="play">
▶
</button>

<button id="reset" class="reset">
↻
</button>

</div>

</main>

</div>


<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

/* SYNCHRONISATION AVEC LE TÉLÉPHONE 1 */

const peer=new Peer();

peer.on("connection",connection=>{

 connection.on("data",message=>{

  if(message.type==="prediction"){

   if(message.value==="PLUS DE 7"){
    select(plus7);
   }

   if(message.value==="ÉGAL 7"){
    select(equal7);
   }

   if(message.value==="MOINS DE 7"){
    select(less7);
   }

  }

 });

});


/* CHOIX */

const options=[plus7,equal7,less7];

function select(button){

 options.forEach(x=>{
  x.classList.remove("active");
 });

 button.classList.add("active");
}

plus7.onclick=()=>select(plus7);
equal7.onclick=()=>select(equal7);
less7.onclick=()=>select(less7);


/* MISE */

function getAmount(){

 return parseInt(
  amount.value.replace(/[^0-9]/g,"")
 ) || 0;

}

function setAmount(value){

 amount.value=
 Math.max(0,Math.round(value))+" XOF";

}

amount.onfocus=()=>{

 amount.value=getAmount();

};

amount.onblur=()=>{

 setAmount(getAmount());

};


/* MIN / X2 / X/2 / MAX */

min.onclick=()=>{
 setAmount(100);
};

x2.onclick=()=>{
 setAmount(getAmount()*2);
};

half.onclick=()=>{
 setAmount(getAmount()/2);
};

max.onclick=()=>{
 setAmount(100000);
};


/* VISUEL DES DÉS */

function createFace(number){

 const face=document.createElement("div");

 face.className="face";

 const positions={
  1:["p1"],
  2:["p2a","p2b"],
  3:["p3a","p3b","p3c"],
  4:["p4a","p4b","p4c","p4d"],
  5:["p5a","p5b","p5c","p5d","p5e"],
  6:["p6a","p6b","p6c","p6d","p6e","p6f"]
 };

 positions[number].forEach(position=>{

  const pip=document.createElement("i");

  pip.className="pip "+position;

  face.appendChild(pip);

 });

 return face;

}


function showDice(a,b){

 die1.innerHTML="";
 die2.innerHTML="";

 die1.appendChild(createFace(a));
 die2.appendChild(createFace(b));

}

showDice(6,1);


/* BOUTON VERT */

play.onclick=()=>{

 die1.classList.add("rolling");
 die2.classList.add("rolling");

 setTimeout(()=>{

  const a=
  1+Math.floor(Math.random()*6);

  const b=
  1+Math.floor(Math.random()*6);

  showDice(a,b);

  die1.classList.remove("rolling");
  die2.classList.remove("rolling");

 },800);

};


/* RESET */

reset.onclick=()=>{

 options.forEach(x=>{
  x.classList.remove("active");
 });

 setAmount(400);

 showDice(6,1);

};


/* BOUTON MISE */

coins.onclick=()=>{

 amount.focus();

};

</script>

</body>
</html>
