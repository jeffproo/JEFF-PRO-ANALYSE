<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JEFF PRO</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

/* IMAGE EXACTE DU DEPOT */
#screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
}

/* ZONES CLIQUABLES */
.zone{
    position:absolute;
    z-index:10;
    background:transparent;
    cursor:pointer;
    border-radius:12px;
}

.zone:active{
    background:rgba(255,255,255,.12);
}

/* =========================
   CHOIX
========================= */

#plus7{
    left:7%;
    top:45%;
    width:86%;
    height:8%;
}

#egal7{
    left:7%;
    top:54%;
    width:86%;
    height:8%;
}

#moins7{
    left:7%;
    top:63%;
    width:86%;
    height:8%;
}

/* =========================
   CONTROLES DE MISE
========================= */

#min{
    left:4%;
    top:73%;
    width:17%;
    height:6%;
}

#x2{
    left:22%;
    top:73%;
    width:17%;
    height:6%;
}

#half{
    left:40%;
    top:73%;
    width:17%;
    height:6%;
}

#max{
    left:79%;
    top:73%;
    width:17%;
    height:6%;
}

/* =========================
   CHAMP MISE
========================= */

#stake{
    position:absolute;
    z-index:20;

    left:57%;
    top:73%;

    width:21%;
    height:6%;

    padding:0;

    border:none;
    outline:none;

    background:transparent;

    color:#fff;

    font-size:17px;
    font-weight:bold;

    text-align:center;
}

/* =========================
   BOUTONS DU BAS
========================= */

#money{
    left:7%;
    bottom:5%;
    width:24%;
    height:10%;
}

#play{
    left:34%;
    bottom:4%;
    width:32%;
    height:12%;
}

#reset{
    right:7%;
    bottom:5%;
    width:24%;
    height:10%;
}

/* =========================
   SELECTION
========================= */

.selected{
    outline:3px solid rgba(255,255,255,.9);
    background:rgba(255,255,255,.08);
}

/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;

    z-index:50;

    left:50%;
    bottom:18%;

    transform:translateX(-50%);

    width:85%;

    padding:12px 15px;

    background:rgba(0,0,0,.88);

    color:#fff;

    border-radius:12px;

    text-align:center;

    font-size:15px;
    font-weight:bold;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

#message.show{
    opacity:1;
}

/* =========================
   POPUP MISE
========================= */

#overlay{
    position:absolute;

    inset:0;

    z-index:90;

    display:none;

    background:rgba(0,0,0,.65);
}

#amountPanel{
    position:absolute;

    z-index:100;

    display:none;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:85%;
    max-width:360px;

    padding:20px;

    background:#181b22;

    border:1px solid #444;

    border-radius:18px;

    box-shadow:0 15px 50px rgba(0,0,0,.7);
}

#amountPanel h3{
    margin:0 0 15px;

    color:#fff;

    text-align:center;
}

#amountInput{
    width:100%;
    height:50px;

    padding:0 10px;

    border:1px solid #555;

    border-radius:10px;

    outline:none;

    background:#0d0f14;

    color:#fff;

    font-size:18px;
    font-weight:bold;

    text-align:center;
}

.panelButtons{
    display:flex;

    gap:10px;

    margin-top:15px;
}

.panelButtons button{
    flex:1;

    height:45px;

    border:none;

    border-radius:10px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.cancel{
    background:#333944;
    color:#fff;
}

.confirm{
    background:#4caf50;
    color:#fff;
}

/* =========================
   PETITS ECRANS
========================= */

@media(max-width:380px){

    #stake{
        font-size:15px;
    }

    #message{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!--
        IMPORTANT :
        LE NOM DOIT CORRESPONDRE EXACTEMENT
        AU FICHIER PRESENT SUR GITHUB
    -->

    <img
        id="screen"
        src="interface-sans-demo.jpg..jpg"
        alt="Interface JEFF PRO"
    >

    <!-- =========================
         CHOIX
    ========================== -->

    <div
        class="zone"
        id="plus7"
        onclick="selectChoice('PLUS DE 7')">
    </div>

    <div
        class="zone"
        id="egal7"
        onclick="selectChoice('ÉGAL 7')">
    </div>

    <div
        class="zone"
        id="moins7"
        onclick="selectChoice('MOINS DE 7')">
    </div>


    <!-- =========================
         CONTROLES
    ========================== -->

    <div
        class="zone"
        id="min"
        onclick="setMin()">
    </div>

    <div
        class="zone"
        id="x2"
        onclick="multiply(2)">
    </div>

    <div
        class="zone"
        id="half"
        onclick="divide(2)">
    </div>

    <div
        class="zone"
        id="max"
        onclick="setMax()">
    </div>


    <!-- =========================
         CHAMP DE MISE
    ========================== -->

    <input
        id="stake"
        type="number"
        inputmode="numeric"
        value="400"
        onclick="openAmount()"
        onchange="updateAmount()"
    >


    <!-- =========================
         BOUTONS DU BAS
    ========================== -->

    <div
        class="zone"
        id="money"
        onclick="openAmount()">
    </div>

    <div
        class="zone"
        id="play"
        onclick="playGame()">
    </div>

    <div
        class="zone"
        id="reset"
        onclick="resetGame()">
    </div>


    <!-- =========================
         MESSAGE
    ========================== -->

    <div id="message"></div>


    <!-- =========================
         POPUP
    ========================== -->

    <div
        id="overlay"
        onclick="closeAmount()">
    </div>

    <div id="amountPanel">

        <h3>Modifier la mise</h3>

        <input
            id="amountInput"
            type="number"
            inputmode="numeric"
            value="400"
        >

        <div class="panelButtons">

            <button
                class="cancel"
                onclick="closeAmount()">
                Annuler
            </button>

            <button
                class="confirm"
                onclick="confirmAmount()">
                Valider
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let selectedChoice = null;
let amount = 400;


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.classList.add("show");

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(function(){

            message.classList.remove("show");

        },2500);
}


/* =========================
   CHOIX
========================= */

function selectChoice(choice){

    selectedChoice = choice;

    document
        .querySelectorAll(".zone")
        .forEach(function(element){

            element.classList.remove("selected");

        });


    if(choice === "PLUS DE 7"){

        document
            .getElementById("plus7")
            .classList.add("selected");

    }


    if(choice === "ÉGAL 7"){

        document
            .getElementById("egal7")
            .classList.add("selected");

    }


    if(choice === "MOINS DE 7"){

        document
            .getElementById("moins7")
            .classList.add("selected");

    }


    showMessage(
        "Sélection : " + choice
    );
}


/* =========================
   MISE
========================= */

function updateAmount(){

    let value = parseInt(
        document.getElementById("stake").value
    );


    if(isNaN(value) || value < 1){

        value = 1;

    }


    amount = value;

    document.getElementById("stake").value =
        amount;
}


/* =========================
   MIN
========================= */

function setMin(){

    amount = 1;

    document.getElementById("stake").value =
        amount;

    showMessage(
        "Mise minimale : " + amount
    );
}


/* =========================
   MAX
========================= */

function setMax(){

    amount = 1000000;

    document.getElementById("stake").value =
        amount;

    showMessage(
        "Mise maximale : " + amount
    );
}


/* =========================
   X2
========================= */

function multiply(number){

    updateAmount();

    amount = amount * number;

    document.getElementById("stake").value =
        amount;

    showMessage(
        "Mise : " + amount
    );
}


/* =========================
   X/2
========================= */

function divide(number){

    updateAmount();

    amount =
        Math.floor(amount / number);


    if(amount < 1){

        amount = 1;

    }


    document.getElementById("stake").value =
        amount;

    showMessage(
        "Mise : " + amount
    );
}


/* =========================
   OUVRIR MODIFICATION MISE
========================= */

function openAmount(){

    document.getElementById(
        "amountInput"
    ).value = amount;


    document.getElementById(
        "overlay"
    ).style.display = "block";


    document.getElementById(
        "amountPanel"
    ).style.display = "block";


    setTimeout(function(){

        document
            .getElementById("amountInput")
            .focus();

    },100);
}


/* =========================
   FERMER
========================= */

function closeAmount(){

    document.getElementById(
        "overlay"
    ).style.display = "none";


    document.getElementById(
        "amountPanel"
    ).style.display = "none";
}


/* =========================
   VALIDER MISE
========================= */

function confirmAmount(){

    let value = parseInt(
        document.getElementById(
            "amountInput"
        ).value
    );


    if(isNaN(value) || value < 1){

        value = 1;

    }


    amount = value;


    document.getElementById(
        "stake"
    ).value = amount;


    closeAmount();


    showMessage(
        "Mise enregistrée : " + amount
    );
}


/* =========================
   JOUER
========================= */

function playGame(){

    updateAmount();


    if(!selectedChoice){

        showMessage(
            "Choisis d'abord une option."
        );

        return;
    }


    showMessage(
        "Choix : " +
        selectedChoice +
        " — Mise : " +
        amount
    );
}


/* =========================
   RESET
========================= */

function resetGame(){

    selectedChoice = null;

    amount = 400;


    document.getElementById(
        "stake"
    ).value = amount;


    document
        .querySelectorAll(".zone")
        .forEach(function(element){

            element.classList.remove(
                "selected"
            );

        });


    showMessage(
        "Réinitialisé."
    );
}


/* =========================
   EMPÊCHER ZOOM GESTURE
========================= */

document.addEventListener(
    "gesturestart",
    function(event){

        event.preventDefault();

    }
);

</script>

</body>
</html>
