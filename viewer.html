<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jeu des Dés</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
font-family:Arial,sans-serif;
background:#29293a;
color:#fff;
}

body{
overflow-x:hidden;
}

.game{
width:100%;
max-width:500px;
min-height:100vh;
margin:auto;
background:
radial-gradient(circle at 50% 35%,#414156 0%,#2b2b3c 48%,#252535 100%);
position:relative;
overflow:hidden;
}

/* HAUT */

.header{
height:153px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
color:#20202b;
}

.back{
font-size:43px;
font-weight:300;
color:#4d7694;
}

.balanceBox{
display:flex;
align-items:center;
gap:7px;
}

.balance{
min-width:225px;
padding:12px 17px;
border-radius:17px;
background:#77777e;
border:5px solid #b7b7bb;
color:white;
font-size:20px;
font-weight:800;
text-align:center;
}

.plus{
width:53px;
height:53px;
border:0;
border-radius:14px;
background:#23bc58;
color:white;
font-size:34px;
}

.demo{
width:52px;
height:45px;
visibility:hidden;
}

/* CONTENU */

.content{
padding:125px 23px 80px;
}

.choose{
height:55px;
border:2px solid #5f5874;
border-radius:8px;
background:#393747;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
font-weight:700;
margin-left:68px;
}

.question{
position:absolute;
left:24px;
top:282px;
width:72px;
height:72px;
border-radius:10px;
background:linear-gradient(#ffc94d,#9b6b13);
border:4px solid #17151e;
box-shadow:inset 0 0 0 3px #e8bd54,0 4px 8px #0008;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
font-weight:900;
}

/* DÉS */

.dices{
display:flex;
justify-content:center;
gap:25px;
margin-top:55px;
}

.die{
width:205px;
height:205px;
border-radius:50%;
background:radial-gradient(circle at 35% 25%,#fff 0%,#e7e7e7 45%,#c6c6c6 100%);
border:9px solid #e0bd6c;
box-shadow:0 0 0 6px #11111a,inset 0 -12px 20px #8888,0 8px 15px #0008;
display:flex;
align-items:center;
justify-content:center;
color:#161620;
font-size:55px;
font-weight:900;
position:relative;
}

.die::before{
content:"";
position:absolute;
inset:9px;
border-radius:50%;
border:3px solid #fff9;
}

.dieValue{
position:relative;
z-index:2;
}

/* OPTIONS */

.options{
display:flex;
gap:10px;
margin-top:22px;
}

.option{
flex:1;
min-height:94px;
border:3px solid #637088;
border-radius:8px;
background:#373744;
color:#e4cf9a;
font-size:17px;
font-weight:800;
}

.option .line{
display:block;
margin-top:7px;
color:white;
font-size:20px;
}

.option.active{
background:#564d37;
border-color:#d6b766;
}

/* CONTROLES */

.controls{
display:flex;
gap:17px;
margin-top:22px;
}

.control{
flex:1;
height:58px;
border-radius:8px;
border:3px solid #6c6654;
background:linear-gradient(#fff1b5,#d4b45f 55%,#9b7b35);
color:#332d22;
font-size:21px;
box-shadow:0 3px 5px #0007;
}

/* MISE MODIFIABLE */

.amount{
width:190px;
height:60px;
margin-top:24px;
border-radius:8px;
border:4px solid #9b8246;
background:#171725;
color:white;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:21px;
font-weight:700;
box-shadow:inset 0 0 8px #000;
outline:none;
}

.amount:focus{
border-color:#d6b766;
}

/* BAS */

.bottom{
display:flex;
justify-content:center;
gap:25px;
margin-top:12px;
}

.bottomButton{
width:115px;
height:115px;
border-radius:25px;
border:5px solid #171720;
box-shadow:0 4px 7px #0008,inset 0 0 0 4px #8f7543;
font-size:55px;
display:flex;
align-items:center;
justify-content:center;
}

.money{
background:linear-gradient(#5378ff,#294fd4);
}

.play{
background:linear-gradient(#9bea48,#56bd18);
font-size:62px;
color:white;
}

.reset{
background:linear-gradient(#557cff,#3155d8);
}

/* ANIMATION */

@keyframes roll{
0%{transform:rotate(0) scale(1)}
25%{transform:rotate(-12deg) scale(1.05)}
50%{transform:rotate(12deg) scale(1.1)}
75%{transform:rotate(-8deg) scale(1.05)}
100%{transform:rotate(0) scale(1)}
}

.rolling{
animation:roll .8s ease;
}

/* PETITS ÉCRANS */

@media(max-width:390px){

.header{
padding:0 12px;
}

.balance{
min-width:180px;
font-size:16px;
}

.die{
width:145px;
height:145px;
}

.content{
padding-left:15px;
padding-right:15px;
}

.question{
left:15px;
}

.choose{
margin-left:55px;
}

.bottomButton{
width:90px;
height:90px;
}

}
</style>
</head>

<body>

<div class="game">

<header class="header">

<div class="back">‹</div>

<div class="balanceBox">

<div class="balance">
17 396 655.03 F
</div>

<button class="plus">+</button>

</div>

<button class="demo"></button>

</header>


<main class="content">

<div class="choose">
Choisissez votre cote
</div>

<div class="question">
?
</div>


<div class="dices">

<div id="die1" class="die">
<span class="dieValue">6</span>
</div>

<div id="die2" class="die">
<span class="dieValue">1</span>
</div>

</div>


<div class="options">

<button id="plus7" class="option">
Plus de 7
<span class="line">◉ × 2.3</span>
</button>

<button id="equal7" class="option">
Égal 7
<span class="line">◉ × 5.8</span>
</button>

<button id="less7" class="option">
Moins de 7
<span class="line">◉ × 2.3</span>
</button>

</div>


<div class="controls">

<button class="control">MIN</button>
<button class="control">X2</button>
<button class="control">X/2</button>
<button class="control">MAX</button>

</div>


<input
id="amount"
class="amount"
type="number"
min="0"
inputmode="numeric"
value="400"
placeholder="Montant"
>


<div class="bottom">

<button class="bottomButton money">
🪙
</button>

<button id="play" class="bottomButton play">
▶
</button>

<button id="reset" class="bottomButton reset">
↻
</button>

</div>

</main>

</div>


<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

const peer=new Peer();

const die1=document.getElementById("die1");
const die2=document.getElementById("die2");

const plus7=document.getElementById("plus7");
const equal7=document.getElementById("equal7");
const less7=document.getElementById("less7");

peer.on("connection",function(connection){

connection.on("data",function(message){

if(message.type==="prediction"){

selectPrediction(message.value);

}

});

});


function selectPrediction(value){

plus7.classList.remove("active");
equal7.classList.remove("active");
less7.classList.remove("active");

if(value==="PLUS DE 7"){
plus7.classList.add("active");
}

if(value==="ÉGAL 7"){
equal7.classList.add("active");
}

if(value==="MOINS DE 7"){
less7.classList.add("active");
}

}


/* LANCER */

document.getElementById("play").onclick=function(){

die1.classList.add("rolling");
die2.classList.add("rolling");

setTimeout(function(){

const a=1+Math.floor(Math.random()*6);
const b=1+Math.floor(Math.random()*6);

die1.querySelector(".dieValue").textContent=a;
die2.querySelector(".dieValue").textContent=b;

die1.classList.remove("rolling");
die2.classList.remove("rolling");

},800);

};


/* RESET */

document.getElementById("reset").onclick=function(){

die1.querySelector(".dieValue").textContent="?";
die2.querySelector(".dieValue").textContent="?";

plus7.classList.remove("active");
equal7.classList.remove("active");
less7.classList.remove("active");

};

</script>

</body>
</html>
