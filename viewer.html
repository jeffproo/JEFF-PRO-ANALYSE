<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jeu des dés — simulation</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden
}

body{
  touch-action:manipulation;
  font-family:Arial,sans-serif
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:709px;
  margin:auto;
  overflow:hidden;
  background:#29283e
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  user-select:none
}

.hit{
  position:absolute;
  z-index:10;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer
}

.hit:active{
  background:rgba(255,255,255,.06);
  border-radius:7px
}

/* CHOIX */
.choice{
  top:49%;
  height:7.7%;
  width:25%
}

#plus{left:9.7%}
#equal{left:37.3%}
#minus{left:65.2%}

/* CONTOUR DU CHOIX */
.sel{
  position:absolute;
  z-index:12;
  top:49%;
  height:7.7%;
  width:25%;
  border:3px solid transparent;
  border-radius:7px;
  pointer-events:none
}

#sp{left:9.7%}
#se{left:37.3%}
#sm{left:65.2%}

.sel.on{
  border-color:#a7e51b;
  box-shadow:0 0 5px rgba(167,229,27,.45)
}

/* POINT VERT */
.dot{
  position:absolute;
  z-index:13;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#9df02b;
  box-shadow:0 0 5px #d7ff91;
  display:none;
  pointer-events:none
}

#dp{
  left:14.2%;
  top:53%
}

#de{
  left:41.8%;
  top:53%
}

#dm{
  left:69.6%;
  top:53%
}

.dot.on{
  display:block
}

/* MISE */
#min{
  left:4%;
  top:57.1%;
  width:20.8%;
  height:4.9%
}

#x2{
  left:26%;
  top:57.1%;
  width:20.8%;
  height:4.9%
}

#half{
  left:48.2%;
  top:57.1%;
  width:20.8%;
  height:4.9%
}

#max{
  left:70.5%;
  top:57.1%;
  width:25%;
  height:4.9%
}

/* CHAMP MISE */
#stake{
  position:absolute;
  z-index:20;
  left:4%;
  top:63.9%;
  width:34.5%;
  height:4.7%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:center;
  font-size:clamp(18px,4vw,28px);
  font-weight:800;
  outline:none
}

/* BOUTONS DU BAS */
#coins{
  left:10%;
  top:69.8%;
  width:21%;
  height:10.5%
}

#play{
  left:35.5%;
  top:69.5%;
  width:29.5%;
  height:11.5%
}

#reset{
  left:70.2%;
  top:69.8%;
  width:21%;
  height:10.5%
}

/* MESSAGE */
#toast{
  position:absolute;
  z-index:30;
  left:50%;
  bottom:1.2%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.88);
  color:#fff;
  padding:8px 14px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap
}

#toast.on{
  opacity:1
}
</style>
</head>

<body>

<div id="app">

<img id="bg" alt="Interface">

<!-- Sélection -->
<div id="sp" class="sel"></div>
<div id="se" class="sel"></div>
<div id="sm" class="sel"></div>

<!-- Points verts -->
<div id="dp" class="dot"></div>
<div id="de" class="dot"></div>
<div id="dm" class="dot"></div>

<!-- Choix -->
<button id="plus" class="hit choice"></button>
<button id="equal" class="hit choice"></button>
<button id="minus" class="hit choice"></button>

<!-- Mise -->
<button id="min" class="hit"></button>
<button id="x2" class="hit"></button>
<button id="half" class="hit"></button>
<button id="max" class="hit"></button>

<!-- Montant -->
<input
  id="stake"
  value=""
  placeholder="Montant"
  inputmode="numeric"
>

<!-- Boutons -->
<button id="coins" class="hit"></button>
<button id="play" class="hit"></button>
<button id="reset" class="hit"></button>

<div id="toast"></div>

</div>

<script>

/* ================================
   IMAGES
================================ */

const idle =
"data:image/jpeg;base64,TON_IMAGE_IDLE_ICI";

const move =
"data:image/jpeg;base64,TON_IMAGE_MOVE_ICI";

const bg=document.getElementById("bg");
const stake=document.getElementById("stake");
const toast=document.getElementById("toast");

let selected=null;
let busy=false;
let amount=0;


/* ================================
   MESSAGE
================================ */

function msg(text){

  toast.textContent=text;

  toast.classList.add("on");

  clearTimeout(window.tt);

  window.tt=setTimeout(()=>{
    toast.classList.remove("on");
  },1000);

}


/* ================================
   MONTANT
================================ */

function setAmount(n){

  amount=Math.max(0,Math.floor(n));

  if(amount===0){

    stake.value="";

  }else{

    stake.value=
      amount.toLocaleString("fr-FR")+" XOF";

  }

}


function read(){

  let n=parseInt(
    String(stake.value).replace(/\D/g,""),
    10
  );

  return Number.isFinite(n)?n:0;

}


/* ================================
   CHOIX
================================ */

function choose(k){

  if(busy)return;

  selected=k;

  ["p","e","m"].forEach(x=>{

    document
      .getElementById("s"+x)
      .classList.remove("on");

    document
      .getElementById("d"+x)
      .classList.remove("on");

  });


  let z={

    plus:["p","Plus de 7"],

    equal:["e","Égal 7"],

    minus:["m","Moins de 7"]

  }[k];


  document
    .getElementById("s"+z[0])
    .classList.add("on");


  document
    .getElementById("d"+z[0])
    .classList.add("on");


  msg(z[1]);

}


/* ================================
   CHOIX DES COTES
================================ */

plus.onclick=()=>{
  choose("plus");
};

equal.onclick=()=>{
  choose("equal");
};

minus.onclick=()=>{
  choose("minus");
};


/* ================================
   BOUTONS MISE
================================ */

min.onclick=()=>{

  if(!busy){

    setAmount(1);

    msg("MIN");

  }

};


x2.onclick=()=>{

  if(!busy){

    setAmount(
      Math.max(1,read()*2)
    );

    msg("X2");

  }

};


half.onclick=()=>{

  if(!busy){

    setAmount(
      Math.max(
        1,
        Math.floor(read()/2)
      )
    );

    msg("X/2");

  }

};


max.onclick=()=>{

  if(!busy){

    /*
      MAX = 100 000 F
    */

    setAmount(100000);

    msg("MAX");

  }

};


/* ================================
   CHAMP MISE
================================ */

stake.onfocus=()=>{

  stake.value=amount>0
    ?String(amount)
    :"";

  stake.select();

};


stake.onblur=()=>{

  setAmount(read());

};


stake.onkeydown=e=>{

  if(e.key==="Enter"){

    setAmount(read());

    stake.blur();

  }

};


/* ================================
   BOUTON PIECES
================================ */

coins.onclick=()=>{

  if(!busy){

    msg("Pièces");

  }

};


/* ================================
   JEU
================================ */

async function play(){

  if(busy)return;


  if(!selected){

    msg(
      "Choisis Plus de 7, Égal 7 ou Moins de 7"
    );

    return;

  }


  amount=read();


  if(amount<=0){

    msg("Entre un montant");

    return;

  }


  busy=true;


  /*
    Petite animation avant le mouvement
  */

  bg.src=move;


  await new Promise(
    r=>setTimeout(r,450)
  );


  /*
    Animation des dés pendant environ
    3 secondes
  */

  const frames=[
    idle,
    move,
    move,
    idle,
    move
  ];


  for(let i=0;i<18;i++){

    bg.src=
      frames[i%frames.length];


    await new Promise(
      r=>setTimeout(r,167)
    );

  }


  /*
    Arrêt final
  */

  bg.src=move;


  busy=false;


  msg(
    "Tour terminé — simulation"
  );

}


/* ================================
   BOUTON PLAY
================================ */

play.onclick=play;


/* ================================
   RESET
================================ */

reset.onclick=()=>{

  if(busy)return;


  selected=null;


  ["p","e","m"].forEach(x=>{

    document
      .getElementById("s"+x)
      .classList.remove("on");


    document
      .getElementById("d"+x)
      .classList.remove("on");

  });


  setAmount(0);


  bg.src=idle;


  msg("Réinitialisé");

};


/* ================================
   DÉPART
================================ */

setAmount(0);

bg.src=idle;

</script>

</body>
</html>
