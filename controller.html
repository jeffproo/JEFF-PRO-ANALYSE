<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEFF PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#06101d;color:#fff;font-family:Arial,sans-serif}
.screen{max-width:430px;margin:auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 25px;background:linear-gradient(180deg,#071321,#020812)}
.logo{font-size:14px;font-weight:bold;letter-spacing:3px;margin-bottom:55px}
.title{font-size:15px;letter-spacing:2px;text-align:center;font-weight:bold}
.prediction{margin-top:25px;font-size:30px;font-weight:900;color:#20f5c1;text-align:center;min-height:42px}
.launch{margin-top:50px;width:100%;height:62px;border:0;border-radius:14px;background:linear-gradient(180deg,#edf5ff,#c9d9eb);color:#526071;font-weight:900;letter-spacing:2px;font-size:15px}
.launch:active{transform:scale(.97)}
.connection{margin-top:25px;width:100%}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #354252;background:#111c2a;color:#fff;outline:none}
.connect{width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;background:#24364b;color:#fff;font-weight:bold}
.status{margin-top:18px;font-size:12px;color:#8d9aaa;text-align:center}
</style>
</head>

<body>

<div class="screen">

<div class="logo">JEFF PRO</div>

<div class="title">
⚪ UNDER / OVER 7 ⚪<br>
PRÉDICTION
</div>

<div id="prediction" class="prediction">—</div>

<button id="launch" class="launch">
PRÉDIRE
</button>

<div class="connection">

<input id="phone2" placeholder="ID du téléphone 2">

<button id="connect" class="connect">
🔗 CONNECTER
</button>

</div>

<div id="status" class="status">
Connexion…
</div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
const peer=new Peer();

const status=document.getElementById("status");
const prediction=document.getElementById("prediction");

let connection=null;

peer.on("open",id=>{
  status.textContent="🟢 Ton ID : "+id;
});

peer.on("error",error=>{
  status.textContent="⚠️ "+error.type;
});

document.getElementById("connect").onclick=()=>{

  const id=document.getElementById("phone2").value.trim();

  if(!id){
    alert("Entre l'ID du téléphone 2.");
    return;
  }

  connection=peer.connect(id);

  connection.on("open",()=>{
    status.textContent="🟢 Téléphone 2 connecté";
  });

  connection.on("close",()=>{
    status.textContent="🔴 Connexion fermée";
  });
};

document.getElementById("launch").onclick=()=>{

  const values=[
    "PLUS DE 7",
    "MOINS DE 7",
    "ÉGAL 7"
  ];

  const value=
  values[Math.floor(Math.random()*values.length)];

  prediction.textContent=value;

  if(connection && connection.open){

    connection.send({
      type:"prediction",
      value:value
    });

    status.textContent="⚡ Prédiction envoyée";

  }else{

    status.textContent=
    "⚠️ Connecte d'abord le téléphone 2";

  }
};
</script>

</body>
</html>
